apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# Do not add components/public-ingress until the release blockers in deploy/README.md are closed.
# ACCOUNT_ID and GIT_SHA are placeholders on purpose: an unedited overlay fails to pull.
images:
  - { name: dzinga/core-api, newName: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/dzinga/core-api, newTag: GIT_SHA }
  - { name: dzinga/agent, newName: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/dzinga/agent, newTag: GIT_SHA }
  - { name: dzinga/ingest, newName: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/dzinga/ingest, newTag: GIT_SHA }
  - { name: dzinga/quiz, newName: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/dzinga/quiz, newTag: GIT_SHA }
  - { name: dzinga/orgs, newName: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/dzinga/orgs, newTag: GIT_SHA }
  - { name: dzinga/startoff, newName: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/dzinga/startoff, newTag: GIT_SHA }
  - { name: dzinga/web, newName: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/dzinga/web, newTag: GIT_SHA }
