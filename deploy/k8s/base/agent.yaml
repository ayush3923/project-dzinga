apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: agent
spec:
  type: ClusterIP
  selector:
    app: agent
  ports:
    - { name: http, port: 8082, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      serviceAccountName: agent
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: dzinga/agent:unset
          ports:
            - { name: http, containerPort: 8082 }
          env:
            - { name: DZ_AGENT_ADDR, value: "0.0.0.0:8082" }
            - { name: DZ_CORE_URL, value: "http://core-api:8091" }
            - { name: DZ_ORGS_URL, value: "http://orgs:8085" }
            - name: DZ_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef: { name: dzinga-internal, key: internal-token }
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: dzinga-agent, key: anthropic-api-key }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
