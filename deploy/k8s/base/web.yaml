apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - { name: http, port: 3000, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      serviceAccountName: web
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: dzinga/web:unset
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: CORE_API_URL, value: "http://core-api:8091" }
            - { name: INGEST_URL, value: "http://ingest:8083" }
            - { name: AGENT_URL, value: "http://agent:8082" }
            - { name: QUIZ_API_URL, value: "http://quiz:8084" }
            - { name: ORGS_API_URL, value: "http://orgs:8085" }
            - { name: STARTOFF_API_URL, value: "http://startoff:8086" }
            - name: DZ_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef: { name: dzinga-internal, key: internal-token }
            - name: DZ_DISPLAY_NAME
              valueFrom:
                secretKeyRef: { name: dzinga-web, key: display-name, optional: true }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: next-cache, mountPath: /app/.next/cache }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
