openapi: 3.1.0
info:
  title: Dzinga organizations service
  version: 2.0.0
  description: >
    Every company the user has applied to or prefers (ADR 0010): statistics computed from
    core-api's applications, the preferred list and suggestions. Company research
    (profiles, quiz briefings and news, diagnoses, the research queue) moved to the
    startoff service in 2.0.0 (ADR 0011, api/startoff.yaml). Routes are called by the web
    app's server, the agent and startoff. Routes that read applications answer 502 when
    core-api is unreachable.
servers:
  - url: http://127.0.0.1:8085
paths:
  /healthz:
    get:
      summary: Liveness
  /api/v1/organizations:
    get:
      summary: Every organization with applications or on the preferred list (statistics, diagnosis hint), and the preferred list
  /api/v1/organizations/lookup:
    get:
      summary: An organization's id from a company name (?company=; matched by key, so case and punctuation don't matter)
      responses:
        "200": { description: "{id}" }
        "404": { description: No organization for that company }
  /api/v1/organizations/{id}:
    get:
      summary: One organization - statistics and application_history (core-api's analysis rows, newest first)
  /api/v1/organizations/preferred:
    put:
      summary: Replace the preferred list ({names, auto}); returns the report
  /api/v1/suggestions:
    get:
      summary: Up to 3 companies worth applying to now (preferred with nothing open, shortlisted before, replies fast)
