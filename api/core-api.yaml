openapi: 3.1.0
info:
  title: Dzinga core-api
  version: 0.1.0
  description: |
    Owns applications, their email events and the user's intent.
    Local: single user, loopback only. Production: every /api route requires a
    Cognito JWT and is scoped to its subject.
servers:
  - url: http://127.0.0.1:8081
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200": { description: ok }
  /api/v1/summary:
    get:
      summary: Data for the Today view
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
  /api/v1/applications:
    get:
      summary: List applications, newest activity first
      parameters:
        - { name: stage, in: query, schema: { $ref: "#/components/schemas/Stage" } }
        - { name: q, in: query, description: Full-text search (prefix match), schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: object
                required: [applications]
                properties:
                  applications: { type: array, items: { $ref: "#/components/schemas/Application" } }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/applications/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      summary: One application with its email timeline
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema:
                type: object
                required: [application, events]
                properties:
                  application: { $ref: "#/components/schemas/Application" }
                  events: { type: array, items: { $ref: "#/components/schemas/Event" } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Correct an application's stage ("" clears the override), details or interview progress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stage: { oneOf: [{ $ref: "#/components/schemas/Stage" }, { const: "" }] }
                company: { type: string, maxLength: 120 }
                role: { type: string, maxLength: 200 }
                job_url: { type: string }
                rounds_done: { type: integer, minimum: 0, maximum: 20 }
                next_step: { type: string, maxLength: 120 }
      responses:
        "200": { description: Updated; returns the application's id, which changes if it was merged }
        "204": { description: Updated }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/profile/photo:
    put:
      summary: Upload the profile photo (JPEG or PNG, at most 5 MB and 4096 px). Re-encoded as a 512 px JPEG without metadata.
      responses:
        "200": { description: The profile, with photo_updated_at }
        "413": { description: Too large }
        "415": { description: Not a JPEG or PNG }
    get:
      summary: The profile photo (image/jpeg)
      responses:
        "404": { description: No photo }
    delete:
      summary: Remove the profile photo
      responses:
        "204": { description: Removed }
  /api/v1/intent:
    get:
      summary: The user's job-search intent (PRD stage 1)
      responses:
        "200":
          description: Intent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Intent" }
    put:
      summary: Replace the intent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Intent" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Intent" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/applications/{id}/fit-request:
    post:
      summary: Queue an Opus fit score for Claude's next run (ADR 0007)
      responses:
        "202": { description: Queued; returns research_requested_at }
        "404": { description: No such application }
  /internal/v1/research-requests:
    get:
      summary: Claude's pending work, oldest first
      security: [{ internalToken: [] }]
  /api/v1/applications/{id}/interview-notes:
    post:
      summary: Save the user's notes on an interview round ({round, body} - 10-4000 characters) and queue Claude's interview_review
      responses:
        "201": { description: Saved; returns the note }
        "400": { description: Invalid note }
        "404": { description: No such application }
        "409": { description: The application is not in the interview stage }
  /internal/v1/applications/{id}/interview-review:
    post:
      summary: Save Claude's review of the interview notes (chance low|medium|high, summary, signals, concerns, next_steps, model); completes the request
      security: [{ internalToken: [] }]
      responses:
        "204": { description: Saved }
        "400": { description: Invalid review }
        "404": { description: No such application }
  /internal/v1/events:
    post:
      summary: Ingest classified job emails (service-to-service only)
      security: [{ internalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              additionalProperties: false
              properties:
                events: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/IngestEvent" } }
      responses:
        "200":
          description: Stored (idempotent on message_id)
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: integer }
                  added: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    internalToken: { type: http, scheme: bearer }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
  schemas:
    Stage:
      type: string
      enum: [applied, assessment, interview, offer, rejected]
    EventKind:
      type: string
      enum: [applied, assessment, interview, offer, rejected, update]
    Application:
      type: object
      required: [id, company, role, stage, stage_is_manual, source_account, accounts, applied_at, last_activity_at, event_count]
      properties:
        id: { type: integer }
        company: { type: string }
        role: { type: string }
        stage: { $ref: "#/components/schemas/Stage" }
        stage_is_manual: { type: boolean }
        source_account: { type: string }
        accounts: { type: array, items: { type: string }, description: Every mailbox this application's emails came from, sorted }
        applied_at: { type: string, format: date-time }
        last_activity_at: { type: string, format: date-time }
        event_count: { type: integer }
        rounds_done: { type: integer, minimum: 0, maximum: 20, description: Interview rounds completed, set by the user }
        next_step: { type: string, maxLength: 120, description: What comes next, set by the user }
    Event:
      type: object
      required: [id, account, occurred_at, sender, subject, snippet, kind]
      properties:
        id: { type: integer }
        account: { type: string }
        occurred_at: { type: string, format: date-time }
        sender: { type: string }
        subject: { type: string }
        snippet: { type: string, description: "At most ~400 characters; full bodies are never stored" }
        kind: { $ref: "#/components/schemas/EventKind" }
    IngestEvent:
      type: object
      required: [message_id, account, occurred_at, company, kind]
      additionalProperties: false
      properties:
        message_id: { type: string }
        account: { type: string }
        occurred_at: { type: string, format: date-time }
        sender: { type: string }
        subject: { type: string, maxLength: 500 }
        snippet: { type: string, maxLength: 2000 }
        company: { type: string, maxLength: 200 }
        role: { type: string, maxLength: 200 }
        kind: { $ref: "#/components/schemas/EventKind" }
        sender_name: { type: string, maxLength: 200 }
        job_url: { type: string, maxLength: 2000, description: https link to the posting found in the email }
        job_ref:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,40}$"
          description: >
            Requisition id from the email body (e.g. R-2312345). Applications to the same role
            with different ids stay separate; re-sending a stored message fills in a missing id,
            and maintenance splits applications that hold two.
    Summary:
      type: object
      required: [total, by_stage, needs_nudge, recent_events]
      properties:
        total: { type: integer }
        by_stage:
          type: object
          additionalProperties: { type: integer }
        needs_nudge: { type: array, items: { $ref: "#/components/schemas/Application" } }
        recent_events:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/Event" }
              - type: object
                properties:
                  application_id: { type: integer }
                  company: { type: string }
                  role: { type: string }
    Intent:
      type: object
      additionalProperties: false
      properties:
        roles: { type: array, maxItems: 10, items: { type: string, maxLength: 100 } }
        designation: { type: string, maxLength: 100 }
        locations: { type: array, maxItems: 10, items: { type: string, maxLength: 100 } }
        salary_min: { type: integer, minimum: 0 }
        salary_max: { type: integer, minimum: 0 }
        currency: { type: string, enum: [INR, USD] }
        company_types: { type: array, maxItems: 10, items: { type: string } }
        situation: { type: string, enum: ["", exploring, immediate, reentry, growth] }
